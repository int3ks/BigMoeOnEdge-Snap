name: Publish release

# Run by hand once a build is approved. Takes the APK of the latest successful "Android NPU APK" run (or the run
# given below) and publishes it as GitHub release v0.6.N. The app's "App update" card installs the newest release,
# so only approved builds reach it. Release assets download without a GitHub login, unlike Actions artifacts.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'NPU build run id (empty = latest successful one)'
        required: false
        default: ''
  # Only so GitHub lists this workflow (a dispatch-only workflow outside the default branch is not shown until it
  # has run once). A push never publishes: the job below runs for a manual start alone.
  push:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Find the build
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-npu.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo "::error::No successful NPU build found"; exit 1; }
          SHA=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "Build run $RUN_ID, commit $SHA"

      - name: Download its APK
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n BigMoeOnEdge-Snap-NPU-apk -D out
          APK=$(ls out/*.apk | head -1)
          VERSION=$(basename "$APK" | sed -n 's/^BigMoeOnEdge-Snap-NPU-\([0-9][0-9.]*\)-.*\.apk$/\1/p')
          [ -n "$VERSION" ] || { echo "::error::Cannot read the version from $(basename "$APK")"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la out

      - name: Publish
        run: |
          TAG="v$VERSION"
          # Errors also become annotations, so they show on the run page without opening the log.
          fail() { echo "::error::$1"; [ -s "$RUNNER_TEMP/gh.err" ] && while IFS= read -r l; do echo "::error::$l"; done < "$RUNNER_TEMP/gh.err"; exit 1; }
          # "published", "draft" or empty. A draft is left behind when an earlier run uploaded the APK but could
          # not publish; this run then reuses it instead of stopping with "already exists".
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" 2>"$RUNNER_TEMP/gh.err" | head -1) \
            || fail "Could not list the releases"
          [ "$STATE" != "published" ] || fail "Release $TAG already exists"
          if [ "$STATE" = "draft" ]; then
            echo "Reusing the draft of $TAG"
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber 2>"$RUNNER_TEMP/gh.err" \
              || fail "Could not upload the APK to the draft $TAG"
          else
            # Created as a draft first and published in a second call, so a failed publish can be retried.
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft \
              --title "BigMoeOnEdge² $VERSION" \
              --notes "NPU build of ${SHA::7} (Actions run $RUN_ID). Installs as an update over earlier Snap builds; in the app: Settings → App update." \
              2>"$RUNNER_TEMP/gh.err" || fail "Could not create the draft $TAG"
          fi
          for i in 1 2 3; do
            if gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest 2>"$RUNNER_TEMP/gh.err"; then
              echo "Published $TAG"
              exit 0
            fi
            echo "::warning::Publishing $TAG failed (attempt $i): $(head -c 300 "$RUNNER_TEMP/gh.err")"
            sleep 15
          done
          fail "Could not publish $TAG (the draft with the APK is kept; re-run this workflow to try again)"
