name: Android NPU APK

# The main APK: the engine with the optional Hexagon/NPU prefill path (application id com.bigmoe.onedge.snap).
# Phones without a supported Snapdragon NPU run it CPU-only. Signed with the same release key as the CPU-only
# workflow, so either APK installs as an update over the other.
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/build-hexagon-onedge-engine.sh'
      - 'scripts/verify-npu-payload.sh'
      - '.github/workflows/android-npu.yml'

permissions:
  contents: read

concurrency:
  group: android-npu-${{ github.ref }}
  # A new push cancels the build that is still running for an older commit.
  cancel-in-progress: true

jobs:
  # A third-party image, so it runs in its own job without secrets; only the job below signs.
  native-hexagon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOOLCHAIN_IMAGE: ghcr.io/snapdragon-toolchain/arm64-android@sha256:91714433626f0d94a926538a1e46ec43756c5b8e3262b91b95df1e812940aed1
      CCACHE_VERSION: 4.10.2
      CCACHE_SHA256: 80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The engine (llama.cpp, the NPU backend, the JNI bridge) depends only on app/src/main/cpp, the two build scripts
      # and the toolchain image. Their git tree hashes name the result: a push that changed none of them (most app
      # changes) restores the engine built before instead of compiling it again for ~7 minutes. The APK job below
      # verifies the payload either way.
      - name: Native cache key
        id: key
        run: |
          cpp=$(git rev-parse HEAD:app/src/main/cpp)
          build=$(git rev-parse HEAD:scripts/build-hexagon-onedge-engine.sh)
          verify=$(git rev-parse HEAD:scripts/verify-npu-payload.sh)
          image=${TOOLCHAIN_IMAGE##*:}
          echo "key=hexagon-native-v1-${cpp:0:16}-${build:0:12}-${verify:0:12}-${image:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore the engine built from the same sources
        id: native
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/hexagon
          key: ${{ steps.key.outputs.key }}

      # When the engine has to be built: ccache keeps compiled objects between runs, so a change in one engine file
      # does not recompile all of llama.cpp. The binary runs inside the toolchain container (x86-64 glibc).
      - name: Prepare ccache
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ccache.tar.xz" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-linux-x86_64.tar.xz"
          echo "${CCACHE_SHA256}  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ccache-bin" .ccache
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP/ccache-bin" --strip-components=1 \
            "ccache-${CCACHE_VERSION}-linux-x86_64/ccache"

      - name: Restore ccache
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-hexagon-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-hexagon-

      - name: Build libonedge-engine.so with Hexagon support
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -e OUT=/workspace/build-hexagon-onedge \
            -e BMOE_BUILD_JOBS="$(nproc)" \
            -e BMOE_CCACHE=/ccache-bin/ccache \
            -e CCACHE_DIR=/workspace/.ccache -e CCACHE_BASEDIR=/workspace -e CCACHE_NOHASHDIR=true \
            -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=1500M -e CCACHE_UMASK=002 \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP/ccache-bin:/ccache-bin:ro" \
            "$TOOLCHAIN_IMAGE" \
            bash /workspace/scripts/build-hexagon-onedge-engine.sh

      - name: ccache statistics
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          CCACHE_DIR="$PWD/.ccache" "$RUNNER_TEMP/ccache-bin/ccache" --print-stats 2>/dev/null \
            | grep -E '^(direct_cache_hit|preprocessed_cache_hit|cache_miss)\s' \
            | tr '\n' ' ' | sed 's/^/::notice::ccache /' || true
          echo

      - name: Save ccache
        if: steps.native.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-hexagon-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the engine for later builds from the same sources
        if: steps.native.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/hexagon
          key: ${{ steps.key.outputs.key }}

      - name: Engine source
        run: |
          if [ "${{ steps.native.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Engine restored from cache (${{ steps.key.outputs.key }}): app/src/main/cpp and the build scripts are unchanged."
          else
            echo "::notice::Engine built (${{ steps.key.outputs.key }})."
          fi
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/assets/hexagon

      - uses: actions/upload-artifact@v4
        with:
          name: onedge-hexagon-native
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/hexagon
          if-no-files-found: error
          retention-days: 1

  apk:
    needs: native-hexagon
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # SHA-256 of the release certificate (public). Every APK is checked against it, so a build can never
      # ship with another key and break updates over an installed copy.
      BMOE_EXPECTED_CERT_SHA256: 655108e1291983045db6079d4fc44c5dcf04cc14aa0a83db89fd16ec8cec6db0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Every build counts up: the number of commits since the 0.6.0 baseline (commit count 471) becomes the patch
      # version, 0.6.1, 0.6.2, ..., and raises versionCode with it. Needs the full history (fetch-depth: 0).
      - name: Build number
        run: |
          N=$(( $(git rev-list --count HEAD) - 471 ))
          [ "$N" -ge 1 ] || N=1
          echo "BMOE_BUILD_NUMBER=$N" >> "$GITHUB_ENV"
          echo "Version 0.6.$N (versionCode $((11 + N)))"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: onedge-hexagon-native
          path: app/src/main

      - name: Verify native NPU payload
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/assets/hexagon
          bash scripts/verify-npu-payload.sh app/src/main/jniLibs/arm64-v8a app/src/main/assets/hexagon

      # The same key signs every build, so each APK installs as an update over the previous one.
      # Secrets: BMOE_KEYSTORE_BASE64, BMOE_KEYSTORE_PASSWORD, BMOE_KEY_ALIAS (see docs/SIGNING.md).
      - name: Restore signing key
        env:
          BMOE_KEYSTORE_BASE64: ${{ secrets.BMOE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BMOE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret BMOE_KEYSTORE_BASE64 is not set. Without the release key the APK could not update an installed copy. See docs/SIGNING.md."
            exit 1
          fi
          # Line breaks and spaces picked up while pasting the secret are dropped.
          printf '%s' "$BMOE_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/bmoe-release.jks" || {
            echo "::error::Secret BMOE_KEYSTORE_BASE64 is not valid base64 (A-Z, a-z, 0-9, +, /, =). Paste the content of snap-release.jks.b64, not snap-release.jks."
            exit 1
          }
          echo "BMOE_KEYSTORE_FILE=$RUNNER_TEMP/bmoe-release.jks" >> "$GITHUB_ENV"

      - name: Build NPU-enabled debug APK
        env:
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
          BMOE_KEY_PASSWORD: ${{ secrets.BMOE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # Compiler errors also become annotations, so they show on the run page without opening the log.
          ./gradlew --no-daemon :app:assembleDebug -PbmoePrebuiltNative=true -PbmoeRequireStableSigning=true -PbmoeBuildNumber="$BMOE_BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            grep -E '^e: |error:|What went wrong' -A2 "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Verify APK contents and signing certificate
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libonedge-engine.so'
          for f in libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            unzip -l "$APK" | grep -q "assets/hexagon/$f" || { echo "::error::Missing $f in APK"; exit 1; }
          done
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -qi "SHA-256 digest: $BMOE_EXPECTED_CERT_SHA256" || {
            echo "::error::APK is not signed with the expected release certificate ($BMOE_EXPECTED_CERT_SHA256)"
            exit 1
          }

      - name: Rename APK
        run: |
          VERSION="0.6.$BMOE_BUILD_NUMBER"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/BigMoeOnEdge-Snap-NPU-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BigMoeOnEdge-Snap-NPU-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
