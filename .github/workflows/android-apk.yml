name: Android APK (CPU)

# Builds the regular CPU-only APK (application id com.bigmoe.onedge.snap). Runs on every push that
# touches the app or the build, and on demand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  # Queue behind a running build instead of cancelling it.
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # SHA-256 of the release certificate (public). Every APK is checked against it, so a build can never
      # ship with another key and break updates over an installed copy.
      BMOE_EXPECTED_CERT_SHA256: 655108e1291983045db6079d4fc44c5dcf04cc14aa0a83db89fd16ec8cec6db0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The same key signs every build, so each APK installs as an update over the previous one.
      # Secrets: BMOE_KEYSTORE_BASE64, BMOE_KEYSTORE_PASSWORD, BMOE_KEY_ALIAS (see docs/SIGNING.md).
      - name: Restore signing key
        env:
          BMOE_KEYSTORE_BASE64: ${{ secrets.BMOE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BMOE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret BMOE_KEYSTORE_BASE64 is not set. Without the release key the APK could not update an installed copy. See docs/SIGNING.md."
            exit 1
          fi
          echo "$BMOE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bmoe-release.jks"
          echo "BMOE_KEYSTORE_FILE=$RUNNER_TEMP/bmoe-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          BMOE_KEYSTORE_PASSWORD: ${{ secrets.BMOE_KEYSTORE_PASSWORD }}
          BMOE_KEY_ALIAS: ${{ secrets.BMOE_KEY_ALIAS }}
          BMOE_KEY_PASSWORD: ${{ secrets.BMOE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PbmoeRequireStableSigning=true

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$CERTS"
          echo "$CERTS" | grep -qi "SHA-256 digest: $BMOE_EXPECTED_CERT_SHA256" || {
            echo "::error::APK is not signed with the expected release certificate ($BMOE_EXPECTED_CERT_SHA256)"
            exit 1
          }

      - name: Rename APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/BigMoeOnEdge-Snap-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BigMoeOnEdge-Snap-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
